context:
  version: "0.5.1"

package:
  name: rashid
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/r/rashid/rashid-${{ version }}.tar.gz
  sha256: f3fbd3a23a84dbcecfffce81768b2078c547ffe784d3d672d913c3c409f5325e

build:
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  python:
    entry_points:
      - rashid = rashid.cli:main

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - click >=8.4
    - jsonschema >=4.26
    - jsonschema-rs >=0.58
    - jsonschema-specifications >=2023.3.6
    - referencing >=0.30
    - pyarrow >=21
    - rasterio >=1.4.4
    - rio-cogeo >=6
    - pyproj >=3.7.1
    - shapely >=2.1
    - orjson >=3.11
    - obstore >=0.9
    - python-tzdata

tests:
  - python:
      imports:
        - rashid
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - rashid --help
      - rashid check --help

about:
  homepage: https://github.com/portolan-sdi/rashid
  summary: Validator and linter for Portolan catalogs
  description: |
    rashid checks a Portolan catalog against the Portolan specification. It
    validates the STAC metadata, the profile schema, the data files, and the
    hosting of a published catalog.
  license: Apache-2.0
  license_file: LICENSE
  repository: https://github.com/portolan-sdi/rashid

extra:
  recipe-maintainers:
    - nlebovits
